<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101421">
<title>Chaos Coordinator</title>
<style>
:root{
  --bg:#0b0e18;--panel:#141a2a;--panel2:#192238;--line:#2b3650;
  --text:#f2f3fa;--muted:#aab2c8;--pink:#f04ab5;--purple:#a879ff;
  --teal:#42e0d0;--mint:#b2fff1;--shadow:0 12px 30px #0005;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 85% 0%,#39204b55,transparent 32%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
button{font:inherit;cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
.sidebar{background:#0d1220;border-right:1px solid var(--line);padding:22px 15px;display:flex;flex-direction:column;gap:22px}
.brand{padding:4px 10px 16px;border-bottom:1px solid var(--line)}
.brandmark{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;line-height:1.05;letter-spacing:-.7px}
.skull{font-size:30px;filter:drop-shadow(0 0 8px #f04ab566)}
.brand small{display:block;color:var(--teal);letter-spacing:2px;font-size:10px;margin:12px 0 0 4px}
nav{display:grid;gap:6px}
.navbtn{border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:10px;display:flex;gap:12px;align-items:center;transition:.15s}
.navbtn .ico{width:22px;text-align:center;font-size:17px}
.navbtn:hover{background:#1a2032;color:var(--text)}
.navbtn.active{background:linear-gradient(90deg,#f04ab533,#a879ff22);border-color:#f04ab566;color:white;box-shadow:inset 3px 0 var(--pink)}
.sidebar-note{margin-top:auto;padding:14px 12px;color:#dca5ef;font-style:italic;border-top:1px solid var(--line);font-size:13px}
main{min-width:0;padding:28px clamp(18px,3vw,42px) 40px;max-width:1600px;width:100%;margin:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.eyebrow{color:var(--teal);text-transform:uppercase;letter-spacing:2px;font-size:10px;font-weight:800}
h1{font-size:clamp(25px,3vw,34px);line-height:1.15;margin:3px 0 0;letter-spacing:-1px}
.top-actions{display:flex;align-items:center;gap:10px}
.iconbtn,.profile{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:10px 12px}
.profile{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--purple));font-weight:800;color:#180d24}
.hero{position:relative;overflow:hidden;border:1px solid #8d56ad66;border-radius:18px;padding:23px 25px;background:linear-gradient(110deg,#21172f 0%,#19243b 58%,#10303a 100%);box-shadow:var(--shadow);margin-bottom:20px}
.hero:after{content:"✦  ✧  ♡";position:absolute;right:25px;top:12px;color:#f78bd4;font-size:40px;opacity:.7;transform:rotate(-12deg)}
.hero p{margin:7px 0 0;color:#d1d5e4;max-width:600px}
.hero strong{color:#fff}
.hero .scribble{color:#ff8cda;font-style:italic;font-size:13px;margin-top:13px}
.grid{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:16px}
.card{background:linear-gradient(145deg,var(--panel),#111827);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between}
.card h2 span{font-size:12px;color:var(--muted);font-weight:500}
.wide{grid-column:span 2}
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #293149}
.task:last-child{border-bottom:0}
.task input{accent-color:var(--pink);width:17px;height:17px;margin:2px 0 0}
.task label{flex:1}
.task small{display:block;color:var(--muted);font-size:11px}
.task.done label{text-decoration:line-through;color:#8992a9}
.linkbtn{border:0;background:transparent;color:var(--teal);font-size:12px;padding:7px 0}
.statrow{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:12px 0 5px}
.bar{height:8px;border-radius:99px;background:#28334b;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--purple),var(--teal))}
.quickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick{border:1px solid var(--line);background:#192238;border-radius:12px;padding:13px 7px;text-align:center;color:var(--text)}
.quick b{display:block;font-size:21px;margin-bottom:5px}
.quick small{font-size:11px;color:var(--muted)}
.bill{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #293149}
.bill:last-child{border:0}
.bill small{display:block;color:var(--muted);font-size:11px}
.amount{text-align:right;white-space:nowrap;font-weight:700}
.pill{display:inline-block;border-radius:20px;padding:3px 8px;font-size:10px;background:#f04ab522;color:#ff9cdb;margin-top:4px}
.pill.teal{background:#42e0d022;color:var(--teal)}
.activity{display:flex;gap:10px;align-items:center;padding:8px 0;color:var(--muted);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px #42e0d077}
.view{display:none}.view.active{display:block}
.placeholder{min-height:240px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:28px}
.placeholder .big{font-size:42px;margin-bottom:10px}
.placeholder h2{color:var(--text);margin:0 0 5px}
.mobile-nav{display:none}
 .toast{position:fixed;bottom:20px;right:20px;background:#222d42;border:1px solid var(--teal);padding:11px 15px;border-radius:12px;box-shadow:var(--shadow);display:none}
.field{display:grid;gap:6px;color:var(--muted);font-size:12px}
.field input{width:100%;min-width:0;background:#0e1422;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;font-size:14px}
.formgrid{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end}
.primary{border:1px solid #f04ab566;background:linear-gradient(120deg,#f04ab5,#a879ff);color:#160e22;font-weight:800;border-radius:10px;padding:10px 13px;white-space:nowrap}
.empty{color:var(--muted);font-size:13px;padding:16px 0}
.entry{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #293149}
.entry:last-child{border-bottom:0}
.entry-main{flex:1;min-width:0}
.entry-main strong{display:block;color:var(--text);overflow-wrap:anywhere}
.entry-main small{display:block;color:var(--muted);font-size:11px}
.entry-action{border:1px solid var(--line);background:#192238;color:var(--muted);border-radius:8px;padding:6px 9px;font-size:11px}
.entry.done .entry-main strong{text-decoration:line-through;color:#8992a9}
.goalcheck{accent-color:var(--teal);width:18px;height:18px}
@media(max-width:900px){.formgrid{grid-template-columns:1fr 1fr}.formgrid .primary{grid-column:span 2}}
@media(max-width:650px){.formgrid{grid-template-columns:1fr}.formgrid .primary{grid-column:auto}}
@media(max-width:900px){.app{grid-template-columns:210px 1fr}.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}.quickgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.app{display:block}.sidebar{display:none}main{padding:20px 15px 90px}.topbar{align-items:flex-start}.top-actions .profile span:last-child{display:none}.hero{padding:20px}.hero:after{font-size:25px;right:15px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:5;background:#0d1220f5;border-top:1px solid var(--line);justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.mobile-nav button{background:none;border:0;color:var(--muted);font-size:10px;display:grid;gap:2px;justify-items:center;padding:3px}.mobile-nav button b{font-size:18px}.mobile-nav button.active{color:var(--pink)}}

.more-sheet{display:none}
@media(max-width:650px){
  .more-sheet.open{display:block;position:fixed;inset:0;z-index:80;background:#0008}
  .more-panel{position:absolute;left:12px;right:12px;bottom:78px;background:#111827;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 20px 60px #000a}
  .more-panel h3{margin:2px 4px 10px;font-size:16px}
  .more-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .more-grid button{border:1px solid var(--line);background:#192238;color:var(--text);border-radius:12px;padding:13px 10px;text-align:left;font-weight:700}
  .more-grid button span{display:block;color:var(--muted);font-size:10px;font-weight:500;margin-top:2px}
  .more-grid .danger{color:#ff9cdb}
}

/* v7 mobile-fit + housekeeping */
html,body{max-width:100%;overflow-x:hidden}
img,svg,canvas{max-width:100%}
main,.app,.card,.hero,.topbar,.profile,.entry,.field{min-width:0}
input,select,textarea,button{max-width:100%}
@media(max-width:650px){
  body{width:100%;overflow-x:hidden}
  main{width:100%;max-width:100vw;padding-left:12px;padding-right:12px}
  .topbar{gap:10px;max-width:100%}
  .top-actions{min-width:0}
  .profile{min-width:0;max-width:48vw}
  .profile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card,.hero{width:100%;max-width:100%;overflow:hidden}
  .formgrid{display:grid;grid-template-columns:minmax(0,1fr)}
  .formgrid .primary{grid-column:auto}
  .field input,.field select,.field textarea{width:100%;min-width:0}
  .quickgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .entry{min-width:0}
  .entry-main{min-width:0;overflow-wrap:anywhere}
}
.chore-form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end}
.chore-list{display:grid;gap:8px}
.chore-row{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:11px;background:#111827}
.chore-row.done{opacity:.62}
.chore-row.done .chore-title{text-decoration:line-through}
.chore-check{accent-color:var(--teal);width:19px;height:19px;margin-top:2px;flex:0 0 auto}
.chore-main{min-width:0;flex:1}
.chore-title{font-weight:800;overflow-wrap:anywhere}
.chore-meta{font-size:11px;color:var(--muted);margin-top:3px}
.chore-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.chore-actions button{border:1px solid var(--line);background:#192238;color:var(--muted);border-radius:8px;padding:5px 7px;font-size:10px}
.chore-filter{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}
.chore-filter button{border:1px solid var(--line);background:#192238;color:var(--muted);border-radius:999px;padding:6px 10px;font-size:11px}
.chore-filter button.active{color:var(--teal);border-color:#42e0d077}
@media(max-width:900px){.chore-form{grid-template-columns:1fr 1fr}.chore-form .chore-title-field{grid-column:span 2}}
@media(max-width:650px){.chore-form{grid-template-columns:minmax(0,1fr)}.chore-form .chore-title-field{grid-column:auto}.chore-row{align-items:flex-start}.chore-actions{max-width:80px}}

/* v7.2 housekeeping magic */
.hk-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.hk-tabs button,.room-chip{border:1px solid var(--line);background:#192238;color:var(--muted);border-radius:999px;padding:7px 11px;font-size:11px}
.hk-tabs button.active,.room-chip.active{color:var(--teal);border-color:#42e0d077}
.room-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.room-card{border:1px solid var(--line);border-radius:14px;padding:13px;background:#111827;min-width:0}
.room-card.focus{border-color:#42e0d077;box-shadow:0 0 0 1px #42e0d022 inset}
.room-card h3{margin:0 0 5px;font-size:14px}
.room-card p{margin:0;color:var(--muted);font-size:11px}
.room-add{display:flex;gap:8px;margin-top:12px}
.room-add input{flex:1;min-width:0}
.cc-modal{display:none;position:fixed;inset:0;z-index:90;background:#050814cc;align-items:center;justify-content:center;padding:16px}
.cc-modal.open{display:flex}
.cc-modal-card{width:min(520px,100%);max-height:90vh;overflow:auto;background:#0f1728;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 24px 80px #0009}
.cc-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.today-chore-list{display:grid;gap:7px}
.today-chore{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.today-chore:last-child{border-bottom:0}
.today-chore span{min-width:0;overflow-wrap:anywhere}
@media(max-width:650px){.room-grid{grid-template-columns:minmax(0,1fr)}.room-add{flex-direction:column}.cc-modal-card{padding:14px}}

/* v8.3 live dashboard — built on last known-good v7.2.2 */
.command-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.command-stat{border:1px solid var(--line);background:#111827;border-radius:14px;padding:12px;min-width:0}
.command-stat b{display:block;font-size:22px;color:var(--teal)}
.command-stat small{color:var(--muted)}
.live-list{display:grid;gap:8px}
.live-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.live-item:last-child{border-bottom:0}
.live-date{flex:0 0 48px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 3px;font-size:10px;color:var(--muted)}
.live-date b{display:block;color:var(--text);font-size:15px}
.live-copy{min-width:0;overflow-wrap:anywhere}.live-copy strong{color:var(--text)}.live-copy small{display:block;color:var(--muted);margin-top:2px}
.focus-room{font-size:20px;font-weight:900;color:var(--teal);margin:7px 0}
@media(max-width:650px){.command-summary{gap:6px}.command-stat{padding:9px}.command-stat b{font-size:18px}}
.season-picks{display:flex;gap:9px;flex-wrap:wrap;margin-top:7px}.season-picks label{display:flex;align-items:center;gap:4px;font-weight:500;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:9px}.season-picks input{width:auto!important;margin:0!important}.season-tag{font-size:12px;color:var(--muted)}

/* v15.8: Planner-inspired dashboard, preserving existing theme and controls */
#home .planner-grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:14px;align-items:stretch}
#home .planner-mischief{grid-row:span 2;min-height:340px;border-color:var(--purple)}
#home .planner-dates,#home .planner-meals{min-height:158px}
#home .planner-extras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0 0 16px}
#home .planner-extra{min-width:0;display:flex;flex-direction:column}
#home .planner-extra .linkbtn{margin-top:auto;align-self:flex-start}
#home .planner-note-lines{min-height:60px;margin:4px 0 12px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--line) 26px,var(--line) 27px)}
#home .planner-print-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 18px;flex-wrap:wrap}
#home #plannerDate{font-weight:700;color:var(--muted)}
#home .planner-print-toolbar button{padding:10px 17px;border-radius:12px;border:1px solid var(--purple);background:var(--panel2);color:var(--text);font-weight:750}
#home .planner-print-toolbar button:hover{border-color:var(--pink)}
@media(max-width:850px){#home .planner-grid{grid-template-columns:1fr 1fr}#home .planner-mischief{grid-column:1/-1;grid-row:auto;min-height:0}#home .planner-extras{grid-template-columns:1fr 1fr}#home .planner-extras .planner-extra:last-child{grid-column:1/-1}}
@media(max-width:600px){#home .planner-grid,#home .planner-extras{grid-template-columns:1fr}#home .planner-mischief,#home .planner-extras .planner-extra:last-child{grid-column:auto}}

/* v15.8.4: chore dashboard fills available card; preview-only until confirmed */
#home .planner-mischief{display:flex;flex-direction:column}
#home .planner-mischief #dashboardChores{flex:1;align-content:start}
#home .fresh-start-actions{margin:8px 0 12px}
#home .fresh-start-actions button{display:inline-block;border:1px solid var(--purple);border-radius:10px;padding:10px 13px;background:var(--panel2);color:var(--text);font-weight:700;cursor:pointer;max-width:100%;white-space:normal;text-align:left}
.cc-fresh-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:14px}
.cc-fresh-panel{width:min(660px,100%);max-height:90vh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--purple);border-radius:16px;padding:20px;box-shadow:0 18px 60px #0008}
.cc-fresh-panel h2{margin:0 0 8px}.cc-fresh-panel p{line-height:1.5}
.cc-fresh-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.cc-fresh-actions button{padding:9px 13px;border-radius:9px;border:1px solid var(--purple);background:var(--panel2);color:var(--text);cursor:pointer}
.cc-fresh-actions button:disabled{opacity:.5;cursor:wait}
.cc-fresh-preview{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.cc-fresh-preview td,.cc-fresh-preview th{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left}
.cc-fresh-note{font-size:12px;color:var(--muted)}
</style>
<style>
.savings-plan{margin-top:10px;padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.035)}
.savings-plan .plan-line{margin-top:5px}.savings-plan strong{font-size:1.06rem}
.savings-milestones{display:flex;justify-content:space-between;gap:6px;margin-top:8px;font-size:.78rem;opacity:.78}
.savings-milestones .reached{font-weight:800;opacity:1}
</style><style>
.savings-plan{padding:8px 10px!important;margin-top:7px!important;font-size:.88rem;line-height:1.25}
.savings-plan .plan-line{margin-top:3px!important}
.savings-plan strong{font-size:.98rem!important}
.savings-milestones{margin-top:6px!important;font-size:.72rem!important}
#savingsList .entry{align-items:flex-start}
#savingsList .entry-main>strong{font-size:1rem}
#savingsList .entry-main>small{font-size:.78rem}
</style><style>
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.calendar-head>button,.calendar-nav-actions button{min-width:42px}
.calendar-nav-actions{display:flex;gap:8px}
.month-weekdays,.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.month-weekdays{margin-bottom:6px;text-align:center;font-size:.75rem;font-weight:800;opacity:.65}
.month-day{min-height:88px;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:7px;background:rgba(255,255,255,.025);cursor:pointer;text-align:left;overflow:hidden}
.month-day:hover{background:rgba(255,255,255,.06)}
.month-day.other-month{opacity:.32}.month-day.selected{outline:2px solid currentColor}.month-day.today .day-number{font-weight:900;text-decoration:underline}
.day-number{display:block;font-size:.84rem;margin-bottom:5px}
.day-event{display:block;font-size:.7rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.day-more{display:block;font-size:.68rem;opacity:.7;margin-top:3px}
@media(max-width:650px){
 .month-weekdays,.month-grid{gap:3px}
 .month-day{min-height:58px;padding:5px}
 .day-event{display:none}
 .month-day.has-events::after{content:"•";display:block;font-size:1.2rem;line-height:.7;text-align:center}
 .month-day.many-events::after{content:"••"}
 .calendar-head{align-items:flex-start}.calendar-nav-actions{gap:4px}
}
</style>
<style>
/* V13.3.2 dark-mode visibility fix */
.month-day,.month-day .day-number{
  color:#f7f2ff !important;
}
.month-day.other-month,.month-day.other-month .day-number{
  color:#c8bdd8 !important;
  opacity:.62;
}
.month-day.today .day-number{
  color:#ffffff !important;
}
input[type="date"],input[type="time"],input[type="datetime-local"]{
  color-scheme:dark;
  color:#f7f2ff;
}
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator,
input[type="datetime-local"]::-webkit-calendar-picker-indicator{
  filter:invert(1) brightness(1.8);
  opacity:.95;
  cursor:pointer;
}
</style>

<style>
/* V13.3.3: reliable picker icons on dark backgrounds */
.picker-wrap{position:relative;display:flex;align-items:center;width:100%}
.picker-wrap>input{width:100%;padding-right:46px!important}
.picker-wrap>input::-webkit-calendar-picker-indicator{
  opacity:0!important;
  width:42px;height:100%;position:absolute;right:0;cursor:pointer;
}
.cc-picker-button{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
